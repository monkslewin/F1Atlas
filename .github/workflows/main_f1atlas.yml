```yaml
name: Build and deploy F1Atlas API to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build F1Atlas API
        run: dotnet build F1Atlas.API/F1Atlas.API.csproj --configuration Release

      - name: Publish F1Atlas API
        run: dotnet publish F1Atlas.API/F1Atlas.API.csproj --configuration Release --output ${{ env.DOTNET_ROOT }}/myapp

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: f1atlas-api
          path: ${{ env.DOTNET_ROOT }}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: f1atlas-api

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8B300CF980C047108CF5138E27F72C8D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D46F09789A38488BA4CBFCEAAF8980A7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6B9AC60BE200436285BED1468130FCC5 }}

      - name: Deploy F1Atlas API to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'F1Atlas'
          slot-name: 'Production'
          package: .
```
