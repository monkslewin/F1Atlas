name: Deploy F1Atlas API

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: f1atlas-api-finn-c3bubybphaeuevdt
  DOTNET_VERSION: '10.0.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore F1Atlas.API/F1Atlas.API.csproj

      - name: Build
        run: dotnet build F1Atlas.API/F1Atlas.API.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish F1Atlas.API/F1Atlas.API.csproj --configuration Release --output ./publish --no-build

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish