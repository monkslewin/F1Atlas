name: Build and deploy F1Atlas Web to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build F1Atlas Web
        run: dotnet build F1Atlas.Web/F1Atlas.Web.csproj --configuration Release

      - name: Publish F1Atlas Web
        run: dotnet publish F1Atlas.Web/F1Atlas.Web.csproj --configuration Release --output ${{ env.DOTNET_ROOT }}/myapp

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: f1atlas-web
          path: ${{ env.DOTNET_ROOT }}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download Web artifact
        uses: actions/download-artifact@v4
        with:
          name: f1atlas-web

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_703EFF9283B448599572D98790AEA9A5 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0E9471EFA42042199D464CEE55705CFB }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C772415E50264E18A1AEC7DF73492851 }}

      - name: Deploy F1Atlas Web to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'F1Atlas-Web'
          slot-name: 'Production'
          package: .